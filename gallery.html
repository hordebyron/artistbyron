<script>
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll('a.work[href^="art/gallery/"]'));
  if (!links.length) return;
  var box = document.getElementById('lightbox');
  var img = document.getElementById('lb-img');
  var i = 0;
  function show(n){
    i = (n + links.length) % links.length;
    img.src = links[i].getAttribute('href');
    var thumb = links[i].querySelector('img');
    img.alt = thumb ? (thumb.getAttribute('alt') || '') : '';
    box.classList.add('open');
    box.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function hide(){
    box.classList.remove('open');
    box.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  links.forEach(function(a, n){
    a.addEventListener('click', function(e){ e.preventDefault(); show(n); });
  });
  document.getElementById('lb-close').addEventListener('click', hide);
  document.getElementById('lb-prev').addEventListener('click', function(e){ e.stopPropagation(); show(i - 1); });
  document.getElementById('lb-next').addEventListener('click', function(e){ e.stopPropagation(); show(i + 1); });
  box.addEventListener('click', function(e){ if (e.target === box) hide(); });
  document.addEventListener('keydown', function(e){
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') hide();
    if (e.key === 'ArrowLeft') show(i - 1);
    if (e.key === 'ArrowRight') show(i + 1);
  });
})();
</script>
