<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde on XRP</title>
<meta name="description" content="XRP side of the Horde. Connect with Xaman or Joey, or paste your XRPL address, and see how much Byron art you hold on XRP.">
<link rel="stylesheet" href="style.css?v=2">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
.collection-list{list-style:none;margin:18px 0 0;padding:0;text-align:left}
.collection-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid rgba(255,255,255,.08)}
.collection-row img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:0 0 48px;background:#222}
.collection-row .collection-name{flex:1;min-width:0;font-weight:600;overflow-wrap:break-word}
.collection-row .collection-count{font-weight:700;white-space:nowrap}
.collection-row.zero{opacity:.55}
@media (max-width:768px){
  .collection-row{gap:8px}
  .collection-row img{width:40px;height:40px;flex-basis:40px}
}
</style>
</head>
<body class="frame-all">
<div class="sidebars">
<img class="sidebar" src="art/frame/sidebar-left.png" alt="Left sidebar, rusty metal">
<div class="frame-wrap">
<div class="scroll-area">
<main class="wrap xrp-centered">
  <section class="card" id="login-card">
    <h2>Log in</h2>
    <p>
      <button class="btn" type="button" data-xrp-login="Xaman">Log in with Xaman</button>
      <button class="btn ghost" type="button" data-xrp-login="Joey">Joey</button>
    </p>
    <p class="small" id="login-status">Tap Log in with Xaman to scan a code, or paste your address below.</p>
    <div id="xaman-qr" hidden>
      <p>Scan this with your Xaman app to log in.</p>
      <p><img id="xaman-qr-img" src="" alt="Scan this QR code with Xaman" style="max-width:220px;width:100%;background:#fff;padding:8px;border-radius:8px"></p>
      <p><a class="btn" id="xaman-deeplink" href="#">Open in Xaman</a> <button class="btn ghost" type="button" id="xaman-cancel">Cancel</button></p>
    </div>
    <form id="paste-form">
      <label for="xrpl-input">Your XRPL address</label>
      <input type="text" id="xrpl-input" placeholder="r..." autocomplete="off" spellcheck="false">
      <p style="margin-top:10px"><button class="btn" type="submit">Show my XRP Horde</button></p>
    </form>
  </section>

  <section class="card" id="welcome-card" hidden>
    <h2 id="welcome-title">Welcome to the Horde</h2>
    <p id="welcome-text"></p>
    <div id="inventory"></div>
    <p class="small" id="switch-wallet-wrap" hidden><a href="#" id="switch-wallet">Use a different wallet</a></p>
  </section>

</main>
</div>
<img class="frame-img frame-desktop" src="art/frame/layoutframe3.png" alt="Artist Byron frame">
<img class="frame-img frame-mobile" src="art/frame/vertical.png" alt="Artist Byron frame, phone">
<img class="tv-layer" id="tv1" src="art/tv1-top/skully.png" alt="Top TV">
<img class="tv-layer" id="tv2" src="art/tv2-mid/clown.png" alt="Mid TV">
<img class="tv-layer" id="tv3" src="art/tv3-bot1/1.png" alt="Bottom TV 1">
<img class="tv-layer" id="tv4" src="art/tv4-bot2/1.png" alt="Bottom TV 2">
<div class="mtv" id="mtv1"><img src="art/tv-mobile/tv1-top/skully.png" alt="Mobile TV 1"></div>
<div class="mtv" id="mtv2"><img src="art/tv-mobile/tv2-mid/clown.png" alt="Mobile TV 2"></div>
<div class="mtv" id="mtv3"><img src="art/tv-mobile/tv3-bot1/1.png" alt="Mobile TV 3"></div>
<div class="mtv" id="mtv4"><img src="art/tv-mobile/tv4-bot2/1.png" alt="Mobile TV 4"></div>
</div>
<img class="sidebar" src="art/frame/sidebar-right.png" alt="Right sidebar, rusty metal">
</div>
<script src="https://cdn.jsdelivr.net/npm/@xrpl-wallet-kit/browser@0.3.2/dist/xrpl-wallet-kit.iife.js"></script>
<script>
var statusEl = document.getElementById('login-status');
var loginCard = document.getElementById('login-card');
var welcomeCard = document.getElementById('welcome-card');
var welcomeTitle = document.getElementById('welcome-title');
var welcomeText = document.getElementById('welcome-text');
var inventoryEl = document.getElementById('inventory');
var xrplInput = document.getElementById('xrpl-input');
var xamanQrBox = document.getElementById('xaman-qr');
var xamanQrImg = document.getElementById('xaman-qr-img');
var xamanDeeplink = document.getElementById('xaman-deeplink');
/* Xaman public client key for the Horde app. This key is made to live in browser code, it only identifies the app. The API secret is never used here and stays private. */
var XAMAN_API_KEY = '09e6660d-6fce-4f1c-991f-7b0497ef709d';
var xamanKit = null;
function showXamanQr(ev) {
  if (!ev) return;
  if (ev.qrPng) xamanQrImg.src = ev.qrPng;
  if (ev.deeplink) { xamanDeeplink.href = ev.deeplink; } else if (ev.uri) { xamanDeeplink.href = ev.uri; }
  xamanQrBox.hidden = false;
}
function hideXamanQr() { xamanQrBox.hidden = true; xamanQrImg.src = ''; }
function getXamanKit() {
  if (xamanKit) return xamanKit;
  if (typeof XRPLWalletKit === 'undefined' || !XRPLWalletKit.createWalletKit) return null;
  xamanKit = XRPLWalletKit.createWalletKit({ network: 'mainnet', wallets: ['xaman', 'joey-wallet'], xamanClientId: XAMAN_API_KEY, autoReconnect: true });
  var mgr = xamanKit.manager || xamanKit;
  if (mgr && typeof mgr.on === 'function') mgr.on('qr', showXamanQr);
  return xamanKit;
}
/* Pick up a finished Xaman login when the page loads again after the trip to the Xaman app.
   The kit keeps a pending-recovery marker for about 3 minutes, so approve in Xaman and come back quickly. */
async function tryAutoReconnect() {
  var kit = getXamanKit();
  if (!kit) return;
  var mgr = kit.manager || kit;
  if (!mgr || typeof mgr.autoReconnect !== 'function') return;
  try {
    await mgr.autoReconnect();
    var acct = (typeof mgr.getAccount === 'function') ? mgr.getAccount() : null;
    var addr = normAddr(acct);
    if (addr) {
      statusEl.textContent = 'Logged in with Xaman as ' + shortAddr(addr) + '.';
      showHorde(addr);
    }
  } catch (e) {}
}
tryAutoReconnect();
async function loginWithExtension(adapterId, label) {
  var kit = getXamanKit();
  if (!kit) { statusEl.textContent = label + ' login could not load. Paste your address below instead, that still shows your real Horde.'; xrplInput.focus(); return; }
  statusEl.textContent = 'Opening ' + label + '. Approve it in the extension.';
  try {
    var res = await kit.connect(adapterId);
    var addr = normAddr(res && res.account);
    if (addr) {
      statusEl.textContent = 'Logged in with ' + label + ' as ' + shortAddr(addr) + '.';
      showHorde(addr);
    } else {
      statusEl.textContent = label + ' did not return an address. Make sure the extension is installed and unlocked, or paste your address below.';
    }
  } catch (e) {
    statusEl.textContent = label + ' login was cancelled or failed. Make sure the extension is installed and unlocked, or paste your address below.';
  }
}
async function loginWithXaman() {
  var kit = getXamanKit();
  if (!kit) { statusEl.textContent = 'Xaman login could not load. Paste your address below instead, that still shows your real Horde.'; xrplInput.focus(); return; }
  statusEl.textContent = 'Opening Xaman. Scan the code with your Xaman app.';
  try {
    var res = await kit.connect('xaman');
    var addr = normAddr(res && res.account);
    hideXamanQr();
    if (addr) {
      statusEl.textContent = 'Logged in with Xaman as ' + shortAddr(addr) + '.';
      showHorde(addr);
    } else {
      statusEl.textContent = 'Xaman did not return an address. Try again, or paste your address below.';
    }
  } catch (e) {
    hideXamanQr();
    statusEl.textContent = 'Xaman login was cancelled or failed. You can paste your address below instead.';
  }
}
document.getElementById('xaman-cancel').addEventListener('click', function(){ hideXamanQr(); statusEl.textContent = 'Xaman login cancelled. Paste your address below, or tap Log in with Xaman again.'; });
function shortAddr(a){ return a.length > 12 ? a.slice(0,6) + '...' + a.slice(-4) : a; }
function normAddr(a){
  if (!a) return null;
  if (typeof a === 'string') return a;
  if (typeof a === 'object') return a.address || a.account || a.id || null;
  return null;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var namesData = null;
async function getRegisteredName(addr) {
  try {
    var raw = localStorage.getItem('horde_registration');
    if (raw) {
      var r = JSON.parse(raw);
      if (r && r.xrp === addr && r.name) return r.name;
    }
  } catch (e) {}
  try {
    if (!namesData) {
      var res = await fetch('data/names.json');
      namesData = await res.json();
    }
    var names = (namesData && namesData.names) ? namesData.names : {};
    for (var nick in names) {
      var entry = names[nick];
      if (entry && entry.wallet === addr) return (entry.kofi_name || nick);
    }
  } catch (e) {}
  return null;
}
var byronIssuers = { 'rnVwvg7GmJr2DJWXwWKTFHsox1FqcDwney': 'A', 'rMf25RxNs7kXEASdhphjw3xfLkY9pqNubf': 'H' };
var collectionsData = null;
async function loadCollections() {
  if (collectionsData) return collectionsData;
  try {
    var res = await fetch('data/collections.json');
    collectionsData = await res.json();
  } catch (e) { collectionsData = { collections: [], issuers: {} }; }
  return collectionsData;
}
async function liveByronHoldings(addr) {
  var byKey = {};
  var total = 0;
  var marker = null;
  try {
    for (var i = 0; i < 10; i++) {
      var params = { account: addr, ledger_index: 'validated', limit: 400 };
      if (marker) params.marker = marker;
      var res = await fetch('https://xrplcluster.com/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ method: 'account_nfts', params: [params] }) });
      var j = await res.json();
      var nfts = (j.result && j.result.account_nfts) ? j.result.account_nfts : [];
      nfts.forEach(function(nft){
        var letter = byronIssuers[nft.Issuer];
        if (!letter) return;
        var key = letter + '-' + nft.NFTokenTaxon;
        byKey[key] = (byKey[key] || 0) + 1;
        total++;
      });
      marker = (j.result && j.result.marker) ? j.result.marker : null;
      if (!marker) break;
    }
    return { total: total, byKey: byKey };
  } catch (e) { return null; }
}
async function showHorde(addr) {
  /* After login, the login card goes away. Just the welcome, the count, and the list. */
  loginCard.hidden = true;
  hideXamanQr();
  welcomeCard.hidden = false;
  welcomeTitle.textContent = 'Welcome to the Horde';
  welcomeText.textContent = 'Checking your XRP art…';
  inventoryEl.innerHTML = '';
  document.getElementById('switch-wallet-wrap').hidden = true;
  var name = await getRegisteredName(addr);
  var data = await loadCollections();
  var holdings = await liveByronHoldings(addr);
  if (holdings === null) {
    welcomeText.textContent = 'I could not load your art count just now, try again.';
    if (name) welcomeTitle.textContent = 'Welcome to the Horde, ' + name;
    document.getElementById('switch-wallet-wrap').hidden = false;
    return;
  }
  if (name) welcomeTitle.textContent = 'Welcome to the Horde, ' + name;
  var total = holdings.total;
  welcomeText.innerHTML = 'You hold <strong>' + total + '</strong> ' + (total === 1 ? 'piece' : 'pieces') + ' of art from ArtistByron, from all collections.'
    + (name ? '' : ' <a href="register.html">Want us to call you by name next time? Register here.</a>');
  var rows = (data.collections || []).map(function(c){
    var key = c.issuer + '-' + c.taxon;
    return { name: c.name, icon: c.icon, count: holdings.byKey[key] || 0 };
  });
  rows.sort(function(a, b){ return (b.count - a.count) || (a.name < b.name ? -1 : 1); });
  var html = '<ul class="collection-list">';
  rows.forEach(function(r){
    var icon = r.icon ? esc(r.icon) : 'art/horde-h-icon.png';
    html += '<li class="collection-row' + (r.count === 0 ? ' zero' : '') + '">'
      + '<img src="' + icon + '" alt="" loading="lazy">'
      + '<span class="collection-name">' + esc(r.name) + '</span>'
      + '<span class="collection-count">' + r.count + ' ' + (r.count === 1 ? 'piece' : 'pieces') + '</span>'
      + '</li>';
  });
  html += '</ul>';
  inventoryEl.innerHTML = html;
  document.getElementById('switch-wallet-wrap').hidden = false;
}
document.getElementById('switch-wallet').addEventListener('click', function(e){
  e.preventDefault();
  welcomeCard.hidden = true;
  loginCard.hidden = false;
  statusEl.textContent = 'Tap Log in with Xaman to scan a code, or paste your address below.';
});
document.querySelectorAll('[data-xrp-login]').forEach(function(btn){
  btn.addEventListener('click', function(){
    var w = btn.getAttribute('data-xrp-login');
    if (w === 'Xaman') { loginWithXaman(); return; }
    if (w === 'Joey') { loginWithExtension('joey-wallet', 'Joey'); return; }
    statusEl.textContent = w + ' login is coming. For now, paste your XRPL address below, that still shows your real Horde, no seed ever.';
    xrplInput.focus();
  });
});
document.getElementById('paste-form').addEventListener('submit', function(e){
  e.preventDefault();
  var addr = xrplInput.value.trim();
  if (!addr.startsWith('r')) { statusEl.textContent = 'That does not look like an XRPL address, it should start with r.'; return; }
  statusEl.textContent = 'Checking ' + shortAddr(addr) + ' on XRPL.';
  showHorde(addr);
});
</script>
<script src="frame-tvs.js"></script>
</body>
</html>
