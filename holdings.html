<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holdings · Artist Byron</title>
<meta name="description" content="One Horde collection, piece by piece.">
<link rel="stylesheet" href="style.css?v=61">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.pieces figure{margin:0}
.pieces img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#0f0f14}
.pieces figcaption{font-size:.82rem;color:var(--muted);margin-top:4px;word-break:break-word}
</style>
</head>
<body>
<header class="topnav"><div class="topnav-inner"><a class="topnav-brand" href="index.html"><img src="art/horde-h-icon.png" alt="" class="topnav-mark">Artist Byron</a><input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menu"><label for="nav-toggle" class="nav-burger" aria-hidden="true">&#9776;</label><nav class="topnav-links" aria-label="Main"><a href="gallery.html">Gallery</a><span class="nav-drop"><a href="shop.html">Shop</a><span class="nav-menu"><a href="shop.html">Shop, physical art and merch</a><a href="market.html">WAX Market</a><a href="xrp-market.html">XRP Market</a></span></span><a href="profile.html">Profile</a><a href="login.html" id="nav-login">Log in</a></nav></div></header>
<main class="wrap">
  <p><a class="btn ghost" href="profile.html" id="back-link">Back to the profile</a></p>
  <h1 id="h-title">Holdings</h1>
  <p class="small" id="h-sub"></p>
  <p class="small" id="h-status">Loading…</p>
  <p class="small">Sort: <select id="h-sort" style="padding:8px;border-radius:8px;border:1px solid var(--line);background:#0f0f14;color:var(--ink)">
    <option value="default">As found</option>
    <option value="az">Name, A to Z</option>
    <option value="za">Name, Z to A</option>
    <option value="mint">Lowest mint first</option>
  </select></p>
  <div class="pieces" id="h-grid"></div>
  <p style="margin-top:12px"><button class="btn ghost" type="button" id="h-more" hidden>Show more pieces</button></p>
</main>
<footer><div class="wrap"><p>Artist Byron &middot; The Horde &middot; Come for the art, stay for the Horde.</p><p><a href="gallery.html">Gallery</a> &middot; <a href="login.html">Log in</a> &middot; <a href="shop.html">Shop</a> &middot; <a href="contests.html">Contests</a> &middot; <a href="game.html">Play the Game</a> &middot; <a href="register.html">Register</a> &middot; <a href="https://ko-fi.com/artistbyron">Ko-fi</a> &middot; <a href="https://discord.gg/rA3UMEkpqc">Discord</a></p></div></footer>
<script>
var q = new URLSearchParams(location.search);
var SIDE = q.get('side') || '', WALLET = q.get('wallet') || '', CNAME = q.get('cname') || 'Collection', WHO = q.get('who') || '';
var PAGE = 20, shown = 0, items = [], loadingDone = false;
document.getElementById('h-title').textContent = (WHO ? WHO + ' · ' : '') + CNAME;
document.getElementById('h-sub').textContent = (SIDE === 'wax' ? 'On WAX · wallet ' : 'On XRP · wallet ') + WALLET;
var backN = q.get('n'); if (backN) document.getElementById('back-link').href = 'profile.html?n=' + encodeURIComponent(backN);
function ipfsUrl(u){
  if (!u) return '';
  if (u.indexOf('ipfs://') === 0) return 'https://gateway.pinata.cloud/ipfs/' + u.slice(7).replace('ipfs/', '');
  if (u.indexOf('ipfs/') === 0) return 'https://gateway.pinata.cloud/' + u;
  return u;
}
function addPiece(box, img, name){
  var f = document.createElement('figure');
  var im = document.createElement('img');
  im.loading = 'lazy'; im.alt = name || 'Horde piece';
  var cid = '';
  var m = String(img || '').match(/ipfs\/([A-Za-z0-9]+)/) || String(img || '').match(/^(Qm[A-Za-z0-9]+|bafy[0-9a-z]+)$/);
  if (m) cid = m[1];
  var tries = [img];
  if (cid) tries = ['https://gateway.pinata.cloud/ipfs/' + cid, 'https://ipfs.io/ipfs/' + cid, 'https://resizer.atomichub.io/images/v1/preview?ipfs=' + cid + '&size=600&output=webp'];
  var ti = 0, timer = null, done = false;
  function next(){ if (done) return; ti++; if (ti < tries.length) { arm(); im.src = tries[ti]; } else { done = true; f.style.display = 'none'; } }
  function arm(){ clearTimeout(timer); timer = setTimeout(next, 8000); }
  im.onload = function(){ done = true; clearTimeout(timer); };
  im.onerror = function(){ next(); };
  arm(); im.src = tries[0];
  var c = document.createElement('figcaption'); c.textContent = name || '';
  f.appendChild(im); f.appendChild(c);
  box.appendChild(f);
}
function sortedItems(){
  var mode = document.getElementById('h-sort').value;
  var list = items.slice();
  if (mode === 'az') list.sort(function(a, b){ return String(a.name).localeCompare(String(b.name)); });
  if (mode === 'za') list.sort(function(a, b){ return String(b.name).localeCompare(String(a.name)); });
  if (mode === 'mint') list.sort(function(a, b){ return (a.mint || 999999999) - (b.mint || 999999999); });
  return list;
}
function renderMore(){
  var grid = document.getElementById('h-grid');
  var list = sortedItems();
  var end = Math.min(shown + PAGE, list.length);
  for (var i = shown; i < end; i++) addPiece(grid, list[i].img, list[i].name);
  shown = end;
  document.getElementById('h-more').hidden = !(shown < list.length || !loadingDone);
  document.getElementById('h-status').textContent = list.length + (list.length === 1 ? ' piece' : ' pieces') + ', showing ' + shown + '.' + (loadingDone ? '' : ' Still loading…');
}
function rerender(){ shown = 0; document.getElementById('h-grid').innerHTML = ''; renderMore(); }
document.getElementById('h-more').addEventListener('click', renderMore);
document.getElementById('h-sort').addEventListener('change', rerender);
async function loadWax(){
  var coll = q.get('coll'); var page = 1;
  while (page <= 20) {
    var r = await fetch('https://wax.api.atomicassets.io/atomicassets/v1/assets?owner=' + encodeURIComponent(WALLET) + '&collection_name=' + encodeURIComponent(coll) + '&limit=100&page=' + page + '&order_desc=false');
    var j = await r.json();
    var data = j.data || [];
    data.forEach(function(a){
      var d = a.data || {};
      var td = (a.template && a.template.immutable_data) || {};
      var nm = d.name || td.name || 'Piece';
      var cid = d.img || td.img || '';
      items.push({ img: cid ? 'https://gateway.pinata.cloud/ipfs/' + String(cid).replace(/^ipfs:\/\//, '') : '', name: nm, mint: parseInt(a.template_mint || '0', 10) || 999999999 });
    });
    renderMore();
    if (data.length < 100) break;
    page++;
  }
  loadingDone = true; renderMore();
}
async function loadXrp(){
  var issuer = q.get('issuer'), taxon = q.get('taxon');
  var marker = null, pages = 0, mine = [];
  do {
    var b = { method: 'account_nfts', params: [{ account: WALLET, limit: 400 }] };
    if (marker) b.params[0].marker = marker;
    var r = await fetch('https://xrplcluster.com/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
    var j = await r.json();
    ((j.result && j.result.account_nfts) || []).forEach(function(n){
      var iss = n.Issuer || n.issuer, tax = (n.NFTokenTaxon !== undefined ? n.NFTokenTaxon : n.nftoken_taxon);
      if (iss === issuer && String(tax) === String(taxon)) mine.push(n);
    });
    marker = j.result && j.result.marker; pages++;
  } while (marker && pages < 10);
  for (var i = 0; i < mine.length; i += 12) {
    var batch = mine.slice(i, i + 12);
    await Promise.all(batch.map(async function(n){
      var name = 'Piece', img = '';
      try {
        var uriHex = n.URI || n.uri || '';
        var mu = ipfsUrl(uriHex.match(/.{2}/g).map(function(h){ return String.fromCharCode(parseInt(h, 16)); }).join(''));
        if (mu) { var mr = await fetch(mu); var mj = await mr.json(); name = mj.name || name; img = ipfsUrl(mj.image || mj.image_url || ''); }
      } catch (e) {}
      items.push({ img: img, name: name, mint: 999999999 });
    }));
    renderMore();
  }
  loadingDone = true; renderMore();
}
(async function(){
  try {
    if (SIDE === 'wax') await loadWax();
    else if (SIDE === 'xrp') await loadXrp();
    else document.getElementById('h-status').textContent = 'Nothing to show. Open this page from a profile.';
  } catch (e) {
    loadingDone = true;
    document.getElementById('h-status').textContent = 'This collection could not load just now. Close this window and try again in a bit.';
  }
})();
</script>
</body>
</html>
